services:
  server:
    # Pinned to an explicit version, never :latest. The server applies Drizzle
    # migrations on startup and they are forward-only, so a floating tag lets any
    # restart that re-pulls migrate the database as a side effect — with no way back
    # short of restoring a dump.
    #
    # The publish workflow overrides SENSOR_SIM_VERSION through the Portainer stack
    # webhook on each release, so the deployed version is always explicit. The
    # default below is what a plain `docker compose up` gets.
    image: ghcr.io/heinergrote/sensor-sim:${SENSOR_SIM_VERSION:-0.0.3}
    env_file: .env
    environment:
      # The server reaches Postgres over the compose network, so the host is the
      # service name below — not localhost, and not the published host port.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sensorsim}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sensorsim}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - sensor-sim-data:/app/data/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # Start only after migrations have applied cleanly. If the migrate container
        # exits non-zero the server is never started, so a bad migration shows up as
        # a failed deploy instead of a crash-looping app on a half-known schema.
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: applies pending migrations and seeds the default admin, then exits.
  # Same image as the server, different entrypoint — drizzle-kit is a devDependency
  # and is not in the production image, so this runs the compiled migrate script,
  # which uses drizzle-orm's migrator against /app/drizzle.
  migrate:
    image: ghcr.io/heinergrote/sensor-sim:${SENSOR_SIM_VERSION:-0.0.3}
    command: ["node", "dist/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sensorsim}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sensorsim}
    depends_on:
      db:
        condition: service_healthy
    # Must not restart: it is expected to exit 0, and a restart policy would make
    # compose treat a completed run as a failure to keep alive.
    restart: "no"

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensorsim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sensorsim}
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the mount
      # goes at /var/lib/postgresql — not the /var/lib/postgresql/data used by 17 and
      # earlier, which these images refuse to start against.
      - sensor-sim-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sensorsim} -d ${POSTGRES_DB:-sensorsim}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published: only the server needs it. Uncomment to reach the database from
    # the host, e.g. for `pnpm --filter @sensor-sim/server db:studio`.
    # ports:
    #   - "5432:5432"
    restart: unless-stopped

volumes:
  sensor-sim-data:
  sensor-sim-db:
