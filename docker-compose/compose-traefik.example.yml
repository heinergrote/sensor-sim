# Example Traefik reverse-proxy configuration.
# Copy to compose.yml (or include alongside it) and adjust hostnames/resolver as needed.
#
# Prerequisites on the host:
#   - Traefik is running and attached to the external "web" network
#   - A "lets-encrypt" certificate resolver is configured in Traefik
#
# All three server endpoints are served under a single hostname:
#   sensor-sim-server.h9e.de/ws   → raw WebSocket (port 4001)
#   sensor-sim-server.h9e.de/api  → REST (port 4002)
#   sensor-sim-server.h9e.de      → tRPC HTTP + WebSocket (port 4000)
#
# Traefik selects routes by rule specificity, so the path-prefix routers for
# /ws and /api win over the catch-all tRPC router automatically.

networks:
  web:
    external: true   # Traefik's network
  default:           # Internal network for server ↔ web communication

services:
  server:
    image: ghcr.io/heinergrote/sensor-sim-server:latest
    restart: unless-stopped
    networks:
      - web
      - default
    env_file: .env
    labels:
      - "traefik.enable=true"

      # ── tRPC HTTP + WebSocket (port 4000) — catch-all ─────────────────────
      - "traefik.http.routers.sensor-sim-server.rule=Host(`sensor-sim-server.h9e.de`)"
      - "traefik.http.routers.sensor-sim-server.tls=true"
      - "traefik.http.routers.sensor-sim-server.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.sensor-sim-server.service=sensor-sim-server"
      - "traefik.http.services.sensor-sim-server.loadbalancer.server.port=4000"

      # ── Raw WebSocket (port 4001) ──────────────────────────────────────────
      - "traefik.http.routers.sensor-sim-server-ws.rule=Host(`sensor-sim-server.h9e.de`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.sensor-sim-server-ws.tls=true"
      - "traefik.http.routers.sensor-sim-server-ws.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.sensor-sim-server-ws.service=sensor-sim-server-ws"
      - "traefik.http.services.sensor-sim-server-ws.loadbalancer.server.port=4001"

      # ── REST API (port 4002) ───────────────────────────────────────────────
      - "traefik.http.routers.sensor-sim-server-api.rule=Host(`sensor-sim-server.h9e.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.sensor-sim-server-api.tls=true"
      - "traefik.http.routers.sensor-sim-server-api.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.sensor-sim-server-api.service=sensor-sim-server-api"
      - "traefik.http.services.sensor-sim-server-api.loadbalancer.server.port=4002"

  web:
    image: ghcr.io/heinergrote/sensor-sim-web:latest
    restart: unless-stopped
    networks:
      - web
      - default
    env_file: .env
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sensor-sim-web.rule=Host(`sensor-sim-web.h9e.de`)"
      - "traefik.http.routers.sensor-sim-web.tls=true"
      - "traefik.http.routers.sensor-sim-web.tls.certresolver=lets-encrypt"
      - "traefik.http.services.sensor-sim-web.loadbalancer.server.port=3000"
