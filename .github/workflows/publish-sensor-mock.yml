name: Publish sensor-mock to npm

on:
  push:
    tags:
      - "sensor-mock-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & publish sensor-mock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sensor-mock-v}"
          PKG_VERSION="$(node -p "require('./packages/sensor-mock/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi
        if: github.event_name == 'push'

      - name: Typecheck
        run: pnpm --filter sensor-mock typecheck

      - name: Build
        run: pnpm --filter sensor-mock build

      - name: Publish to npm
        run: pnpm --filter sensor-mock publish --access public --no-git-checks --provenance
