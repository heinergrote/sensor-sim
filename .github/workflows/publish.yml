name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/sensor-sim

jobs:
  publish:
    name: Build & publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Portainer stack webhook. The stack's compose pins ghcr.io/<owner>/sensor-sim:${SENSOR_SIM_VERSION},
      # so the tag that triggered this build (e.g. v1.2.3) travels as-is as the deployed version.
      - name: Trigger Portainer redeploy
        run: |
          echo "Redeploying Portainer stack with SENSOR_SIM_VERSION=${{ github.ref_name }}"
          curl --fail-with-body --silent --show-error \
            --request POST "${{ secrets.PORTAINER_WEBHOOK_URL }}?SENSOR_SIM_VERSION=${{ github.ref_name }}"
