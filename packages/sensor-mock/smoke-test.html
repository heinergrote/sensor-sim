<!doctype html>
<html>
<head><meta charset="utf-8"><title>sensor-mock smoke test</title></head>
<body>
<pre id="log"></pre>
<script type="module">
  import { enableSensorMock } from "/dist/index.js";

  const log = (msg) => {
    document.getElementById("log").textContent += msg + "\n";
    console.log(msg);
  };

  const handle = enableSensorMock({
    serverUrl: "https://sensor-sim.h9e.de",
    simId: "sim-1",
    overlay: true,
  });

  handle.subscribe((status) => log("status: " + JSON.stringify(status)));

  navigator.geolocation.watchPosition(
    (pos) => log("watchPosition: " + pos.coords.latitude + ", " + pos.coords.longitude),
    (err) => log("error: " + err.message)
  );

  window.__handle = handle;
</script>
</body>
</html>
